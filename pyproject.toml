[project]
name = "pay-with-a-pause"
version = "0.1.0"
description = "A checkpoint an AI agent must pass before it pays: is this store trustworthy, and is there a better deal?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2"]
dev = ["pytest>=8"]

[project.scripts]
pause = "pause.cli:main"
pause-mcp = "pause.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pause"]

[tool.pytest.ini_options]
testpaths = ["tests"]
